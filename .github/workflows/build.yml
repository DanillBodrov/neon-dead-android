name: Build NEON DEAD APK

on:
workflow_dispatch:
push:
paths:
- 'NEON_DEAD_ANDROID_LAUNCHER_PROJECT.zip'
- '.github/workflows/build.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Download repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Unpack Android project
    run: |
      unzip -o NEON_DEAD_ANDROID_LAUNCHER_PROJECT.zip -d project
      find project -maxdepth 4 -type f | head -100

  - name: Locate Gradle project
    id: locate
    run: |
      DIR=$(find project -name gradlew -type f -print -quit | xargs -r dirname)
      if [ -z "$DIR" ]; then
        DIR=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs -r dirname)
      fi
      if [ -z "$DIR" ]; then
        echo "Android Gradle project not found in ZIP"
        exit 1
      fi
      echo "dir=$DIR" >> "$GITHUB_OUTPUT"

  - name: Build debug APK
    working-directory: ${{ steps.locate.outputs.dir }}
    run: |
      chmod +x ./gradlew 2>/dev/null || true
      if [ -f ./gradlew ]; then
        ./gradlew assembleDebug
      else
        echo "Gradle wrapper missing; cannot build reliably"
        exit 1
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: NEON-DEAD-APK
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
